[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cera-core"
version = "0.1.0"
description = "CERA deterministic authority and character-reasoning foundation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
codex = ["openai-codex==0.144.4", "mcp==1.29.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cera = ["py.typed"]

[tool.unittest]
start-directory = "tests"
