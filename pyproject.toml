[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cera-core"
version = "0.1.0"
description = "CERA deterministic authority and character-reasoning foundation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
codex = ["openai-codex==0.144.4", "mcp==1.29.0"]
dev = ["mypy==2.3.0", "ruff==0.16.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cera = [
    "py.typed",
    "providers/runtime_contracts/*.json",
    "providers/runtime_contracts/*.txt",
]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
required-version = "==0.16.2"
target-version = "py312"
line-length = 100
src = ["src"]
preview = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cera", "scripts", "tests", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = false

[tool.mypy]
python_version = "3.12"
mypy_path = "src,."
strict = true
follow_imports = "silent"
explicit_package_bases = true
scripts_are_modules = true
incremental = false
pretty = true
show_error_codes = true
show_error_code_links = true
show_column_numbers = true
warn_unreachable = true
files = [
    "scripts/run_provider_free_quality_gate.py",
    "src/cera/provider_dispatch_guard.py",
    "src/cera/cognition",
    "src/cera/semantic_validation",
]
exclude = ['^\.chatgpt/', '^build/', '^dist/']
